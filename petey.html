<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petey of the Week | Max's Website</title>
  <link rel="stylesheet" href="assets/styles/style.css" />
  <button id="themeToggle" class="theme-toggle">Toggle Theme</button>
  <script data-goatcounter="https://maxcarriker.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <style>
    .petey-gallery {
      position: relative;
      max-width: 100%;
      text-align: center;
    }
    .petey-img {
      max-width: 100%;
      border-radius: 12px;
      display: none;
    }
    .petey-img.active {
      display: block;
    }
    .petey-caption {
      margin-top: 0.5em;
      font-weight: bold;
    }
    .petey-controls {
      margin-top: 1em;
    }
    .petey-controls button {
      margin: 0 0.5em;
      padding: 0.5em 1em;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: var(--link-color);
      color: white;
    }
    .petey-controls button:hover {
      background-color: var(--link-hover-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html" class="home-link">Home</a>
    </nav>

    <header>
      <h1>Petey of the Week</h1>
      <p class="subtitle">My mom's dog, Petey. Updated weekly. Click through past weeks below.</p>
    </header>

    <section class="card">
      <div class="petey-gallery">
        <img id="peteyImage" src="" alt="Petey" class="petey-img active">
        <p class="petey-caption" id="peteyCaption"></p>
        <div class="petey-controls">
          <button onclick="prevPetey()">Previous</button>
          <button onclick="nextPetey()">Next</button>
        </div>
      </div>
    </section>

    <footer>
      <p>Made with ❤️ by Max Carriker</p>
    </footer>
  </div>
  <script src="/assets/js/theme.js"></script>
  <script>
    let peteyPhotos = [];
    let currentIndex = 0;

    fetch('assets/data/petey-data.json')
      .then(r => r.json())
      .then(data => {
        peteyPhotos = data;
        currentIndex = data.length - 1;
        showPetey();
      });

    function formatDate(dateStr) {
      if (!dateStr) return 'Unknown date';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function showPetey() {
      const photo = peteyPhotos[currentIndex];
      document.getElementById('peteyImage').src = photo.src;
      document.getElementById('peteyCaption').textContent = formatDate(photo.date);
      document.querySelector('button[onclick="prevPetey()"]').disabled = currentIndex === 0;
      document.querySelector('button[onclick="nextPetey()"]').disabled = currentIndex === peteyPhotos.length - 1;
    }

    function prevPetey() {
      if (currentIndex > 0) { currentIndex--; showPetey(); }
    }

    function nextPetey() {
      if (currentIndex < peteyPhotos.length - 1) { currentIndex++; showPetey(); }
    }
  </script>
</body>
</html>
